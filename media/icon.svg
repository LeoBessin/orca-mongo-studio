<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b34"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c6cf2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfd8"/>
    </linearGradient>
    <linearGradient id="dbBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0c8"/>
      <stop offset="1" stop-color="#7a5cf0"/>
    </linearGradient>
    <linearGradient id="dbTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6fff1"/>
      <stop offset="1" stop-color="#d9ccff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="256" cy="262" r="150" fill="url(#glow)"/>

  <!-- { } : the document -->
  <g filter="url(#shadow)" fill="none" stroke="url(#brace)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 126 C140 126 136 146 136 176 L136 222 C136 244 126 256 104 256 C126 256 136 268 136 290 L136 336 C136 366 140 386 178 386"/>
    <path d="M334 126 C372 126 376 146 376 176 L376 222 C376 244 386 256 408 256 C386 256 376 268 376 290 L376 336 C376 366 372 386 334 386"/>
  </g>

  <!-- the database inside it -->
  <g filter="url(#shadow)">
    <path d="M196 206 v100 a60 18 0 0 0 120 0 v-100 z" fill="url(#dbBody)"/>
    <ellipse cx="256" cy="206" rx="60" ry="18" fill="url(#dbTop)"/>
  </g>
  <path d="M196 240 a60 18 0 0 0 120 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <path d="M196 274 a60 18 0 0 0 120 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
</svg>
