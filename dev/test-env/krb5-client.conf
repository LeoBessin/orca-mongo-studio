# Client side, for the tests on this machine: KRB5_CONFIG points here.
[libdefaults]
  default_realm = STUDIO.TEST
  dns_lookup_kdc = false
  dns_canonicalize_hostname = false
  rdns = false
  qualify_shortname = ""
  udp_preference_limit = 1
[realms]
  STUDIO.TEST = {
    kdc = 127.0.0.1:8888
  }
[domain_realm]
  localhost = STUDIO.TEST
